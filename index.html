<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THX牛逼 - 專屬相簿動態</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7f3e8;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            color: #262626;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* 手機寬度容器 */
        .feed-container {
            width: 100%;
            max-width: 470px;
            background: #fffdf5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding-bottom: 60px; /* 留出底部導航欄位置 */
        }

        /* 頂部導航列 */
        .top-nav {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 0.5px solid #dbdbdb;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            color: #111;
            letter-spacing: -0.5px;
        }

        .nav-right-icons {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .nav-right-icons svg {
            width: 24px;
            height: 24px;
            stroke: #262626;
            stroke-width: 2;
            fill: none;
            cursor: pointer;
        }

        /* 貼文卡片 */
        .insta-post {
            border-bottom: 8px solid #f0f2f5;
            background: #fff;
        }

        /* 貼文頭部 */
        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #e1306c;
            padding: 1px;
        }

        .user-names {
            display: flex;
            flex-direction: column;
        }

        .user-name-line {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .username {
            font-size: 13.5px;
            font-weight: 600;
            color: #262626;
        }

        .verified-badge {
            width: 13px;
            height: 13px;
            fill: #0095f6;
        }

        .location {
            font-size: 11.5px;
            color: #65676b;
        }

        /* 貼文主圖片 */
        .post-media {
            width: 100%;
            background: #f8f8f8;
            position: relative;
        }

        .post-media img {
            width: 100%;
            display: block;
            object-fit: cover;
            max-height: 600px;
        }

        /* 貼文操作欄 */
        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* 點贊組件與 "THX很喜歡" */
        .like-box {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .like-icon svg {
            width: 25px;
            height: 25px;
            stroke: #262626;
            stroke-width: 2;
            fill: none;
            transition: transform 0.15s ease;
        }

        .like-box:active .like-icon svg {
            transform: scale(1.2);
        }

        .like-box.liked .like-icon svg {
            stroke: #ed4956;
            fill: #ed4956;
        }

        .like-text {
            font-size: 13px;
            font-weight: 600;
            color: #262626;
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
            stroke: #262626;
            stroke-width: 2;
            fill: none;
            cursor: pointer;
        }

        /* 貼文文字內容 */
        .post-caption {
            padding: 0 14px 14px 14px;
            font-size: 13.5px;
            line-height: 1.45;
        }

        .caption-text {
            margin-bottom: 6px;
        }

        .caption-text .bold-name {
            font-weight: 600;
            margin-right: 6px;
        }

        .comment-hint {
            color: #8e8e8e;
            font-size: 13px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .post-date {
            color: #8e8e8e;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* 底部導航欄（真實可點擊） */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 470px;
            height: 52px;
            background: #ffffff;
            border-top: 0.5px solid #dbdbdb;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
        }

        .nav-link {
            text-decoration: none;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 25%;
            height: 100%;
            font-size: 10px;
            gap: 2px;
        }

        .nav-link svg {
            width: 24px;
            height: 24px;
            stroke: #262626;
            stroke-width: 2;
            fill: none;
        }

        .nav-link.active svg {
            fill: #262626;
        }
    </style>
</head>
<body>

    <div class="feed-container">
        <!-- 頂部導航列 -->
        <header class="top-nav">
            <span class="brand-title">THX牛逼</span>
            <div class="nav-right-icons">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
        </header>

        <!-- 動態流貼文列表（10 篇完整貼文） -->
        <main id="feedList"></main>

        <!-- 底部真實導航欄 -->
        <nav class="bottom-nav">
            <!-- 回到頁面頂部 -->
            <a href="javascript:window.scrollTo({top: 0, behavior: 'smooth'});" class="nav-link active" title="回到頂部">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
            <!-- 直達三上悠亞官方 Instagram -->
            <a href="https://www.instagram.com/yua_mikami/" target="_blank" class="nav-link" title="官方 Instagram">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </a>
            <!-- 重新整理當前相簿 -->
            <a href="javascript:location.reload();" class="nav-link" title="刷新動態">
                <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </a>
            <!-- 回到 GitHub 倉庫主頁 -->
            <a href="https://github.com/unkim295/unkim295.github.io" target="_blank" class="nav-link" title="GitHub 倉庫">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
        </nav>
    </div>

    <script>
        // 10 張照片資料與文案
        const postsData = [
            { img: "https://i.ibb.co/8LvZ90Wd/p4-jpg.jpg", caption: "今天的日常散步，心情特別好 ♡", loc: "Tokyo, Japan", time: "1 小時前" },
            { img: "https://i.ibb.co/v64TBZ4W/p3-jpg.jpg", caption: "生日蛋糕太可愛了～謝謝大家的祝福 🎂✨", loc: "Roppongi, Tokyo", time: "3 小時前" },
            { img: "https://i.ibb.co/27FyXjLb/956508-E3-2-EC6-4-DE8-8-DA9-C3-FAD6582-AA4.jpg", caption: "東京車站前的晴天午後 ☀️", loc: "Tokyo Station", time: "5 小時前" },
            { img: "https://i.ibb.co/F4QJKx8F/51522-C94-9584-4-DE2-B62-D-E1-A9-CB747-F40.jpg", caption: "試穿了新的灰色連身裙，好看嗎？👗", loc: "Shibuya", time: "8 小時前" },
            { img: "https://i.ibb.co/27v3DJ0y/1-E60-F9-E1-2-F2-F-42-A3-AB08-6298131-C7-ABB.jpg", caption: "鏡子自拍一束花造型 🌸", loc: "Studio Omotesando", time: "12 小時前" },
            { img: "https://i.ibb.co/Z6j9JTCQ/70-AAB0-A1-E6-DF-41-C0-9524-15-A0-EB26-A6-FA.jpg", caption: "眨個眼～大家今天過得怎麼樣？😉", loc: "Hair Salon Ginza", time: "1 天前" },
            { img: "https://i.ibb.co/ccKqzWZ0/28-D9954-A-51-E6-4-D56-ADFD-381-A343-FBDF3.jpg", caption: "Hello Kitty 的小包包真的太百搭了 🎀", loc: "Harajuku", time: "1 天前" },
            { img: "https://i.ibb.co/Q7Lt06gw/5131-B16-D-3639-4-A03-92-C0-F1-BD71-D5089-F.jpg", caption: "微捲的髮型是不是更溫柔一些？💇‍♀️", loc: "Daikanyama", time: "2 天前" },
            { img: "https://i.ibb.co/zT1CcWNM/p1-jpg.jpg", caption: "精緻小禮服造型，特別的日子 ✨", loc: "Grand Hyatt Tokyo", time: "2 天前" },
            { img: "https://i.ibb.co/99XVXjTP/p2-jpg.jpg", caption: "夜幕降臨，浪漫的燈光長廊 💫", loc: "Golden Sun Club", time: "3 天前" }
        ];

        const container = document.getElementById('feedList');

        // 自動動態生成 10 篇 Instagram 貼文
        postsData.forEach((post, i) => {
            const article = document.createElement('article');
            article.className = 'insta-post';
            article.innerHTML = `
                <div class="post-header">
                    <div class="user-info">
                        <img src="${post.img}" class="avatar" alt="yua">
                        <div class="user-names">
                            <div class="user-name-line">
                                <span class="username">yua_mikami</span>
                                <svg class="verified-badge" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                            </div>
                            <span class="location">${post.loc}</span>
                        </div>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#262626"><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="12" r="2"/></svg>
                </div>

                <div class="post-media">
                    <img src="${post.img}" alt="Post image ${i + 1}" loading="lazy">
                </div>

                <div class="post-actions">
                    <div class="action-left">
                        <div class="like-box" onclick="togglePostLike(this)">
                            <div class="like-icon">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </div>
                            <span class="like-text">THX很喜欢</span>
                        </div>
                        <div class="action-btn">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        </div>
                        <div class="action-btn">
                            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </div>
                    </div>
                    <div class="action-btn" onclick="toggleBookmark(this)">
                        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    </div>
                </div>

                <div class="post-caption">
                    <div class="caption-text">
                        <span class="bold-name">yua_mikami</span>
                        ${post.caption}
                    </div>
                    <div class="comment-hint">查看全部评论...</div>
                    <div class="post-date">${post.time}</div>
                </div>
            `;
            container.appendChild(article);
        });

        // 點贊切換
        function togglePostLike(el) {
            el.classList.toggle('liked');
        }

        // 收藏切換
        function toggleBookmark(el) {
            const svg = el.querySelector('svg');
            const isSaved = svg.getAttribute('fill') === '#262626';
            svg.setAttribute('fill', isSaved ? 'none' : '#262626');
        }
    </script>
</body>
</html>
